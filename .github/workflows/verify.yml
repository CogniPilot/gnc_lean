name: Verify GNC

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  # Let expensive cold checks finish and save their artifacts. A newer commit
  # waits, then Lake validates and reuses the completed source-matched cache.
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GNC_VERIFY_STREAM: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Restore released dependency artifacts
        id: dependencies
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .lake/packages
            .lake/mathlib-cache
          key: mathlib-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'scripts/setup.py') }}
      - name: Restore project proof artifacts
        id: proofs
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .lake/build
          key: gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}-full-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}-
            gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-
            gnc-${{ runner.os }}-${{ runner.arch }}-
      - name: Check the pinned flake
        run: nix flake check --no-build
      - name: Materialize pinned sources and fetch released mathlib proofs
        id: dependency-setup
        run: nix develop --command gnc-cache
      - name: Save released proofs before the project build
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            .lake/packages
            .lake/mathlib-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      # The largest measured exact check still needs about 14.3 GiB on this
      # release. Add disk-backed headroom for the 16 GiB hosted runner; this
      # does not change the proof terms or any mathematical error budget.
      - name: Provide swap for cold exact certificate checks
        run: |
          sudo fallocate -l 8G /gnc-proof-swap
          sudo chmod 600 /gnc-proof-swap
          sudo mkswap /gnc-proof-swap
          sudo swapon /gnc-proof-swap
      - name: Record runner resources
        run: |
          free -h
          df -h . /nix
      - name: Build general-purpose proofs before application certificates
        id: core-build
        run: nix develop --command lake build GNC.Core
      - name: Checkpoint general-purpose proof artifacts
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .lake/build
          key: gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}-core-${{ github.run_id }}-${{ github.run_attempt }}
      # Checkpoint every expensive successful build before starting the next.
      - name: Build exact pointing-cap certificate
        run: nix develop --command python scripts/build_certificate.py GNC.Applications.OrbitalComparison.PointingCapBernsteinData
      - name: Checkpoint pointing-cap proof artifacts
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .lake/build
          key: gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}-cap-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build exact time-degree-10 certificate
        run: nix develop --command python scripts/build_certificate.py GNC.Applications.OrbitalComparison.BernsteinData.STT8Time10
      - name: Checkpoint time-degree-10 proof artifacts
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .lake/build
          key: gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}-time10-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build exact time-degree-12 certificate
        run: nix develop --command python scripts/build_certificate.py GNC.Applications.OrbitalComparison.BernsteinData.STT8Time12
      - name: Checkpoint time-degree-12 proof artifacts
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .lake/build
          key: gnc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'lakefile.toml') }}-${{ github.sha }}-time12-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build every module and audit proofs, dependencies, and regression checks
        run: |
          (
            while true; do
              free -m
              ps -C lean -o pid,rss,etime,args --sort=-rss | head -n 6
              sleep 30
            done
          ) &
          gnc_monitor_pid=$!
          trap 'kill "$gnc_monitor_pid" 2>/dev/null || true' EXIT
          GNC_SERIAL_BUILD=1 nix develop --command python scripts/verify.py
      - name: Check report against this exact source snapshot
        run: nix develop --command python scripts/verify.py --check-report .lake/verification/report.json
      # Cache completed modules even after an ordinary build/test failure.
      # Lake checks their input traces on reuse; this is not a verification pass.
      - name: Save complete or partial project proof artifacts
        if: always() && steps.dependency-setup.outcome == 'success'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .lake/build
          key: ${{ steps.proofs.outputs.cache-primary-key }}
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gnc-verification-${{ github.sha }}
          path: .lake/verification/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
